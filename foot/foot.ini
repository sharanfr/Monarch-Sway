# -*- conf -*-
# Foot terminal configuration - Material 3 Theme

[main]
font=JetBrainsMono Nerd Font:size=11
pad=15x15
shell=zsh

[cursor]
style=block
color=1A1C1E D1E4FF
blink=yes

[colors]
alpha=0.85
background=1A1C1E
foreground=D1E4FF

## Material 3 Tonal Spot Palette
regular0=1A1C1E  # Black
regular1=FFB4AB  # Red (Error)
regular2=B7F397  # Green (Success)
regular3=F9DDA1  # Yellow (Warning)
regular4=D1E4FF  # Blue (Primary)
regular5=E5B8F4  # Magenta
regular6=A8EBDD  # Cyan
regular7=E2E2E6  # White

bright0=43474E   # Grey
bright1=FF897D   # Bright Red
bright2=96D977   # Bright Green
bright3=E0C171   # Bright Yellow
bright4=82AFFF   # Bright Blue
bright5=C696D1   # Bright Magenta
bright6=87CEBF   # Bright Cyan
bright7=FFFFFF   # Pure White

[csd]
# Hidden title bar for that Android/Sway minimal look
size=0

[tweak]
font-monospace-warn=no
